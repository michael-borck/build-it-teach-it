project:
  type: book
  output-dir: _book
  resources:
    - LICENSE

book:
  title: "Build It, Teach It"
  subtitle: "Hands-on AI Projects for the Classroom"
  author: "Michael Borck"
  date: "last-modified"
  license: "CC BY 4.0 International"
  description: "A project and teaching companion to the HandsOnAI lab: chat, RAG, agents, workflows, loops, evaluation, vision, voice, classroom projects and assessment."
  cover-image: cover.png
  favicon: favicon.svg
  site-url: https://michael-borck.github.io/build-it-teach-it
  repo-url: https://github.com/michael-borck/build-it-teach-it
  repo-branch: main
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - copyright.qmd

    - part: "The Lab"
      chapters:
        - chapters/01-one-call-many-wrappers.qmd
        - chapters/02-set-up-the-lab.qmd
        - chapters/03-chat-prompts-memory.qmd

    - part: "The Modules"
      chapters:
        - chapters/04-grounding-rag.qmd
        - chapters/05-tools-agents.qmd
        - chapters/06-workflows-loops-judges.qmd
        - chapters/07-vision-and-voice.qmd

    - part: "The Projects"
      chapters:
        - chapters/08-choose-a-project.qmd
        - chapters/09-build-and-review.qmd
        - chapters/10-project-gallery.qmd

    - part: "The Classroom"
      chapters:
        - chapters/11-teach-with-the-lab.qmd
        - chapters/12-assess-disclose-safely.qmd

  appendices:
    - appendices/a-module-map.qmd
    - appendices/b-project-template.qmd
    - appendices/c-classroom-checklist.qmd
    - acknowledgments.qmd
    - about-author.qmd

  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 2
  other-links:
    - text: HandsOnAI Docs
      icon: book
      href: https://michael-borck.github.io/hands-on-ai/docs/
    - text: GitHub
      icon: github
      href: https://github.com/michael-borck/hands-on-ai
    - text: All Books
      icon: collection
      href: https://books.borck.education

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: book-design.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    highlight-style: github
  pdf:
    pdf-engine: lualatex
    fontsize: 11pt
    linestretch: 1.08
    include-in-header: [pdf-header.tex, book-design.tex]
    include-before-body:
      - copyright-page.tex
    documentclass: book
    toc: true
    toc-depth: 1
    number-sections: true
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=1in
      - outer=0.625in
      - top=0.75in
      - bottom=0.75in
  epub:
    epub-cover-image: cover.png
    css: [book-design-epub.css]
    toc: true
    toc-depth: 1
